{% extends 'base.html' %}

{% block content %}
    <div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="text-align: center;">Log in</h2>

        {% if form.errors %}
            <p style="color: red; text-align: center;">Your username and password didn't match. Please try again.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label for="id_username">Username:</label><br>
                <input type="text" name="username" id="id_username" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="id_password">Password:</label><br>
                <input type="password" name="password" id="id_password" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>

            <button type="submit" class="btn" style="width: 100%;">Log In</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <p style="text-align: center; margin-top: 15px;">
            No account? <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
{% endblock %}
