<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipswich Books</title>
    <!-- Simple CSS for the storefront -->
    <style>
        body { font-family: Helvetica, Arial, sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
        header { background-color: #EEEEEE; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; color: #1E88E5; }
        nav a { margin-left: 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #1E88E5; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; }
        .card img { max-width: 100%; height: auto; border-radius: 4px; }
        .btn { display: inline-block; background: #1E88E5; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; margin-top: 10px; border: none; cursor: pointer; }
        .btn:hover { background: #1565C0; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'home' %}" style="text-decoration:none; color:inherit;">Ipswich Books</a></h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'cart' %}">Cart 🛒</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Hi, {{ user.username }}</a>

                <!-- ADMIN PANEL SHORTCUT -->
                {% if user.is_staff %}
                    <a href="/admin/" style="color: #1E88E5;">Admin Panel</a>
                {% endif %}

                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:#333; font-weight:bold; cursor:pointer; font-size:16px;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock %}
    </main>
</body>
</html>
