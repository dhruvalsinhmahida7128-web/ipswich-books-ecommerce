global:
  scrape_interval: 15s # Scrape every 15 seconds
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'django-app'
    # We will point this at your live Render URL
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ipswich-books.onrender.com/'] 
      # IMPORTANT: Replace the URL above with YOUR actual live Render URL (without https://)
    scheme: https